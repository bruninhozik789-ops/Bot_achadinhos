<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viral AutoPost</title>
  <meta name="description" content="Viral AutoPost — gerenciamento e publicação de vídeos no TikTok.">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#0f1115;color:#fff;min-height:100vh;display:grid;place-items:center}
    .card{width:min(560px,90%);padding:36px;border-radius:20px;background:#181b22;box-shadow:0 10px 40px #0006;text-align:center}
    h1{margin:0 0 10px;font-size:34px}.sub{color:#b8beca;line-height:1.6}
    button{border:0;border-radius:12px;padding:15px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111;margin-top:18px}
    #status{margin-top:20px;color:#b8beca;font-size:14px;min-height:20px}
    .links{margin-top:28px;font-size:13px}.links a{color:#b8beca;margin:0 8px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Viral AutoPost</h1>
    <p class="sub">Gerencie e publique seus vídeos no TikTok de forma prática.</p>
    <button id="connect">Conectar ao TikTok</button>
    <div id="status"></div>
    <div class="links">
      <a href="termos.html">Termos de Serviço</a>
      <a href="privacidade.html">Política de Privacidade</a>
    </div>
  </main>
  <script>
    document.getElementById('connect').addEventListener('click', function () {
      document.getElementById('status').textContent = 'A integração com o TikTok será iniciada aqui.';
    });
  </script>
</body>
</html>
